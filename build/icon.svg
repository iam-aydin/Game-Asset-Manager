<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="interactive-svg">
      <defs id="svg-defs">
        <filter id="folderShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
        </filter>
        <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15"/>
        </filter>
        <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.45"/>
        </filter>

        <!-- Gradient Definitions -->
        <linearGradient id="folderBack" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffa200" stop-opacity="1"/>
          <stop offset="100%" stop-color="#D97706" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="folderFront" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FBBF24" stop-opacity="1"/>
          <stop offset="100%" stop-color="#F59E0B" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#B45309" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#78350F" stop-opacity="0.65"/>
        </linearGradient>

        <linearGradient id="padBody" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F1F5F9" stop-opacity="1"/>
          <stop offset="100%" stop-color="#CBD5E1" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="tagMp3" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4ADE80" stop-opacity="1"/>
          <stop offset="100%" stop-color="#16A34A" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="tagWav" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
          <stop offset="100%" stop-color="#0284C7" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="tagFlac" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1E3A8A" stop-opacity="1"/>
          <stop offset="100%" stop-color="#0F172A" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- Main Scene Layer Container -->
      <g id="layer-root" filter="url(#folderShadow)" class="">
        <path id="folder-back-shape" d="M 64 140 C 64 126.7 74.7 116 88 116 L 176 116 C 188 116 198.5 122.5 204 133 L 222 164 L 424 164 C 437.3 164 448 174.7 448 188 L 448 396 C 448 409.3 437.3 420 424 420 L 88 420 C 74.7 420 64 409.3 64 396 Z" fill="url(#folderBack)" class=""/>

        <g id="paper-back" transform="translate(0,0) rotate(-3 315 188) scale(1,1)" class="">
          <rect x="230" y="118" width="165" height="130" rx="10" fill="#E2E8F0" opacity="0.8" id="svg-item-1" class=""/>
          <line x1="250" y1="138" x2="330" y2="138" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
          <line x1="250" y1="152" x2="370" y2="152" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
        </g>

        <g id="paper-front" transform="translate(0,0) rotate(2 320 192) scale(1,1)" class="">
          <rect x="235" y="124" width="165" height="130" rx="10" fill="#FFFFFF" id="svg-item-2" class=""/>
          <line x1="255" y1="144" x2="340" y2="144" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
          <line x1="255" y1="158" x2="375" y2="158" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
          <line x1="255" y1="172" x2="310" y2="172" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
        </g>

        <g id="tag-mp3" transform="translate(318.4, 152.27) rotate(-8)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="32" height="50" rx="5" fill="url(#tagMp3)" id="svg-item-3" class=""/>
          <text x="16" y="30" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2" id="svg-item-4" class="">MP3</text>
        </g><g id="tag-wav" transform="translate(347.28, 146.76)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="32" height="50" rx="5" fill="url(#tagWav)" id="svg-item-5" class=""/>
          <text x="16" y="30" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2" id="svg-item-6" class="">WAV</text>
        </g><g id="tag-flac" transform="translate(379.05, 144.33) rotate(8)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="32" height="50" rx="5" fill="url(#tagFlac)" id="svg-item-7" class=""/>
          <text x="16" y="30" font-weight="800" font-size="6.8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2" id="svg-item-8" class="">FLAC</text>
        </g><g id="controller" transform="translate(46.61, 136.13) scale(0.95, 1)" filter="url(#badgeShadow)" class="">
          <path d="M 20 34 C 20 12 40 0 66 0 L 168 0 C 194 0 214 12 214 34 L 214 46 C 214 66 200 78 184 78 C 172 78 166 70 156 70 L 78 70 C 68 70 62 78 50 78 C 34 78 20 66 20 46 Z" fill="url(#tagFlac)" stroke="#004cff" stroke-width="2.5" id="svg-item-9" class="" fill-opacity="0.95" transform="translate(-2, -8) scale(0.95, 0.95)"/>
          <g transform="translate(56, 24)" fill="#6D28D9" id="svg-item-10" class="">
            <rect x="8" y="0" width="8" height="24" rx="2" id="svg-item-11" class="" transform="translate(-16, -12)"/>
            <rect x="0" y="8" width="24" height="8" rx="2" id="svg-item-12" class="" transform="translate(-16, -12)"/>
          </g>
          <g transform="translate(150, 12)" id="svg-item-13" class="">
            <circle cx="12" cy="0" r="5" fill="#F87171" id="svg-item-14" class="" transform="translate(9, -1)"/>
            <circle cx="0" cy="12" r="5" fill="#4ADE80" id="svg-item-15" class="" transform="translate(13, -5)"/>
            <circle cx="24" cy="12" r="5" fill="#FACC15" id="svg-item-16" class="" transform="translate(6, -6)"/>
            <circle cx="12" cy="24" r="5" fill="#60A5FA" id="svg-item-17" class="" transform="translate(10, -10)"/>
          </g>
          <rect x="96" y="28" width="10" height="6" rx="3" fill="#94A3B8" id="svg-item-18" class="" transform="translate(4, -5)"/>
          <rect x="118" y="28" width="10" height="6" rx="3" fill="#94A3B8" id="svg-item-19" class="" transform="translate(-2, -6)"/>
        </g><path id="folder-front-shape" d="M 64 192 L 424 192 C 437.3 192 448 202.7 448 216 L 448 396 C 448 409.3 437.3 420 424 420 L 88 420 C 74.7 420 64 409.3 64 396 Z" fill="url(#folderFront)" class=""/>

        

        

        

        

        <path id="folder-pocket-shape" d="M 136 312 L 376 312 C 384.8 312 392 319.2 392 328 L 385 398 C 385 405.7 378.7 412 371 412 L 141 412 C 133.3 412 127 405.7 127 398 L 120 328 C 120 319.2 127.2 312 136 312 Z" fill="url(#pocketGrad)" stroke="#FCD34D" stroke-width="1.5" class=""/>

        <g id="badge-png" transform="translate(150, 280) rotate(-7) scale(1,1)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="58" height="72" rx="8" fill="#FFFFFF" id="svg-item-20" class=""/>
          <rect x="4" y="4" width="50" height="42" rx="5" fill="#38BDF8" id="svg-item-21" class=""/>
          <circle cx="18" cy="16" r="4" fill="#FEF08A" id="svg-item-22" class=""/>
          <polygon points="10,40 24,22 34,33 42,25 50,40" fill="#0284C7" id="svg-item-23" class=""/>
          <rect x="4" y="49" width="50" height="19" rx="4" fill="#0284C7" id="svg-item-24" class=""/>
          <text x="29" y="63" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" id="svg-item-25" class="">PNG</text>
        </g>

        <g id="badge-gltf" transform="translate(227, 268) rotate(0) scale(1,1)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="58" height="72" rx="8" fill="#FFFFFF" id="svg-item-26" class=""/>
          <rect x="4" y="4" width="50" height="42" rx="5" fill="#F8FAFC" id="svg-item-27" class=""/>
          <g transform="translate(17, 12)" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" id="svg-item-28" class="">
            <path d="M 12 0 L 24 6 L 24 18 L 12 24 L 0 18 L 0 6 Z" id="svg-item-29" class=""/>
            <path d="M 0 6 L 12 12 L 24 6" id="svg-item-30" class=""/>
            <path d="M 12 12 L 12 24" id="svg-item-31" class=""/>
          </g>
          <rect x="4" y="49" width="50" height="19" rx="4" fill="#7C3AED" id="svg-item-32" class=""/>
          <text x="29" y="63" font-weight="900" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" id="svg-item-33" class="">GLTF</text>
        </g>

        <g id="badge-fbx" transform="translate(304, 280) rotate(7) scale(1,1)" filter="url(#badgeShadow)" class="">
          <rect x="0" y="0" width="58" height="72" rx="8" fill="#FFFFFF" id="svg-item-34" class=""/>
          <rect x="4" y="4" width="50" height="42" rx="5" fill="#F8FAFC" id="svg-item-35" class=""/>
          <g transform="translate(15, 10)" fill="#EA580C" id="svg-item-36" class="">
            <path d="M 14 0 L 28 7 L 28 21 L 14 28 L 0 21 L 0 7 Z" opacity="0.9" id="svg-item-37" class=""/>
            <path d="M 0 7 L 14 14 L 28 7 L 14 0 Z" opacity="0.55" id="svg-item-38" class=""/>
          </g>
          <rect x="4" y="49" width="50" height="19" rx="4" fill="#C2410C" id="svg-item-39" class=""/>
          <text x="29" y="63" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" id="svg-item-40" class="">FBX</text>
        </g>

        <g id="wordmark" transform="translate(256, 404) rotate(0) scale(1,1)" filter="url(#textShadow)" class="">
          <text x="0" y="0" font-weight="800" font-size="27" fill="#FFFBEB" text-anchor="middle" letter-spacing="0.3" id="svg-item-41" class="">Game Asset Manager</text>
        </g>
      </g>
    </svg>